<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="streamprobe-operator">
  <rect width="64" height="64" rx="14" fill="#050505"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#10cf53" stroke-opacity=".35" stroke-width="2"/>
  <!-- segments of a playlist, the last one is the live edge -->
  <rect x="10" y="38" width="8" height="14" rx="2" fill="#10cf53" fill-opacity=".35"/>
  <rect x="21" y="34" width="8" height="18" rx="2" fill="#10cf53" fill-opacity=".5"/>
  <rect x="32" y="30" width="8" height="22" rx="2" fill="#10cf53" fill-opacity=".7"/>
  <rect x="43" y="24" width="8" height="28" rx="2" fill="#10cf53"/>
  <!-- the probe's pulse over them -->
  <path d="M8 20h12l4-8 6 16 5-10h21" fill="none" stroke="#eae4e4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
