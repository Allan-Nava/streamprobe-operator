# This rule is not used by the project streamprobe-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to streaming.allan-nava.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: streamprobe-operator
    app.kubernetes.io/managed-by: kustomize
  name: streamprobe-viewer-role
rules:
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes/status
  verbs:
  - get
