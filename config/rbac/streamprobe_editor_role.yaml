# This rule is not used by the project streamprobe-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the streaming.allan-nava.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: streamprobe-operator
    app.kubernetes.io/managed-by: kustomize
  name: streamprobe-editor-role
rules:
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes/status
  verbs:
  - get
