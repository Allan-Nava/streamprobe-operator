---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: streamprobes.streaming.allan-nava.github.io
spec:
  group: streaming.allan-nava.github.io
  names:
    kind: StreamProbe
    listKind: StreamProbeList
    plural: streamprobes
    shortNames:
    - sp
    singular: streamprobe
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.liveEdge
      name: Edge
      type: integer
    - jsonPath: .status.lastAdvanceTime
      name: Advanced
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          StreamProbe watches one live HLS stream: is its playlist moving, and does the origin serve
          its live edge.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of StreamProbe
            properties:
              checkSegment:
                default: true
                description: |-
                  checkSegment asks the origin for the live-edge segment on every check. A playlist can
                  keep moving while the segments it lists return errors.
                type: boolean
              interval:
                default: 30s
                description: interval is how often the stream is checked. At least
                  5s.
                type: string
              staleAfter:
                description: |-
                  staleAfter is how long the live edge may stand still before the stream is Stale.
                  Unset, it is three target durations, read from the playlist.
                type: string
              timeout:
                default: 10s
                description: 'timeout bounds one check: the playlist fetch, the variant''s,
                  and the segment''s.'
                type: string
              url:
                description: |-
                  url is the HLS playlist of the stream: a media playlist, or a multivariant (master) one,
                  in which case the first variant is followed.
                maxLength: 2048
                pattern: ^https?://
                type: string
            required:
            - url
            type: object
          status:
            description: status defines the observed state of StreamProbe
            properties:
              conditions:
                description: 'conditions: Ready, with reason Live, Stale, Ended, FetchFailed,
                  SegmentFailed or Pending.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consecutiveFailures:
                description: consecutiveFailures counts the checks in a row that could
                  not read the playlist.
                format: int32
                type: integer
              lastAdvanceTime:
                description: lastAdvanceTime is when the live edge was last seen moving.
                format: date-time
                type: string
              lastCheckTime:
                description: lastCheckTime is when the stream was last checked.
                format: date-time
                type: string
              lastError:
                description: lastError is the error of the last failed check, empty
                  after a good one.
                type: string
              liveEdge:
                description: |-
                  liveEdge is the sequence number of the last segment listed: mediaSequence plus the
                  segments minus one. It is what "the stream moves" is measured on, because an EVENT
                  playlist keeps its media sequence and only appends segments.
                format: int64
                type: integer
              mediaSequence:
                description: 'mediaSequence is #EXT-X-MEDIA-SEQUENCE at the last successful
                  check.'
                format: int64
                type: integer
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  was written for.
                format: int64
                type: integer
              playlistLatencyMilliseconds:
                description: playlistLatencyMilliseconds is the time to fetch the
                  media playlist.
                format: int64
                type: integer
              playlistURL:
                description: 'playlistURL is the media playlist read: the url, or
                  its first variant.'
                type: string
              segmentStatus:
                description: |-
                  segmentStatus is the HTTP status of the live-edge segment; 0 when it was not checked or
                  the request failed.
                format: int32
                type: integer
              targetDurationSeconds:
                description: 'targetDurationSeconds is #EXT-X-TARGETDURATION at the
                  last successful check.'
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
