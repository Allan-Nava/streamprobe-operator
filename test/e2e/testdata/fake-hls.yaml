# A fake live HLS origin for the end-to-end test (SP-6): a media playlist of 1-second segments
# whose live edge moves with the clock, until GET /stop freezes it. Stdlib Python only, so the
# test needs no image of its own.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-hls
data:
  server.py: |
    import http.server
    import time

    START = time.time()
    WINDOW = 5
    frozen_at = None

    def edge():
        return int((frozen_at or time.time()) - START)

    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            global frozen_at
            if self.path == "/stop":
                frozen_at = frozen_at or time.time()
                self.reply(200, "text/plain", b"stopped\n")
            elif self.path == "/live.m3u8":
                last = edge()
                first = max(0, last - WINDOW + 1)
                lines = ["#EXTM3U", "#EXT-X-VERSION:3", "#EXT-X-TARGETDURATION:1",
                         "#EXT-X-MEDIA-SEQUENCE:%d" % first]
                for i in range(first, last + 1):
                    lines += ["#EXTINF:1.0,", "seg%d.ts" % i]
                self.reply(200, "application/vnd.apple.mpegurl", ("\n".join(lines) + "\n").encode())
            elif self.path.startswith("/seg") and self.path.endswith(".ts"):
                self.reply(200, "video/mp2t", b"\x47" * 188 * 8)
            else:
                self.reply(404, "text/plain", b"not found\n")

        def reply(self, code, ctype, body):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass

    http.server.ThreadingHTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-hls
spec:
  replicas: 1
  selector:
    matchLabels: {app: fake-hls}
  template:
    metadata:
      labels: {app: fake-hls}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: python:3.13-alpine
          command: ["python", "-u", "/app/server.py"]
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /live.m3u8, port: 8080}
            periodSeconds: 2
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: app, mountPath: /app}]
      volumes:
        - name: app
          configMap: {name: fake-hls}
---
apiVersion: v1
kind: Service
metadata:
  name: fake-hls
spec:
  selector: {app: fake-hls}
  ports: [{port: 8080, targetPort: 8080}]
