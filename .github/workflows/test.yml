name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Running Tests
        run: |
          go mod tidy
          make test

  # The alerts: promtool checks the rules file and runs its unit tests (SP-10); and the
  # dashboard's queries are parsed the same way (SP-11).
  alerts:
    permissions:
      contents: read
    name: Alert rules
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: promtool check and test
        run: |
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules dist/chart/files/streamprobe.rules.yaml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            test rules test/prometheus/rules_test.yaml
      # Every query of the Grafana dashboard, parsed by promtool as a recording rule (SP-11).
      - name: Dashboard queries
        run: |
          python3 -c "import json; json.load(open('dist/chart/files/streamprobe-dashboard.json'))"
          python3 test/grafana/dashboard_queries.py dist/chart/files/streamprobe-dashboard.json > dashboard-rules.yaml
          docker run --rm -v "$PWD:/w" -w /w --entrypoint promtool prom/prometheus:v3.5.0 \
            check rules dashboard-rules.yaml

  # BACKLOG.md valid and ROADMAP.md generated from it (backlogsync check; phase warnings
  # are printed and do not fail).
  backlog:
    permissions:
      contents: read
    name: Backlog
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: Allan-Nava/backlogsync@backlogsync--v0.2.0
        with:
          command: check
