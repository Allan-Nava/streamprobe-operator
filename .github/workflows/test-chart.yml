name: Test Chart

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    env:
      IMG: controller:latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: kind create cluster

      - name: Prepare streamprobe-operator
        run: |
          go mod tidy
          make docker-build
          kind load docker-image $IMG

      - name: Install Helm
        run: make install-helm

      - name: Lint Helm Chart
        run: |
          helm lint ./dist/chart

# TODO: Uncomment if cert-manager is enabled
#      - name: Install cert-manager via Helm (wait for readiness)
#        run: |
#          helm repo add jetstack https://charts.jetstack.io
#          helm repo update
#          helm install cert-manager jetstack/cert-manager \
#            --namespace cert-manager \
#            --create-namespace \
#            --set crds.enabled=true \
#            --wait \
#            --timeout 300s

# TODO: Uncomment if Prometheus is enabled
#      - name: Install Prometheus Operator CRDs
#        run: |
#          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#          helm repo update
#          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Deploy manager via Helm
        run: |
          make helm-deploy

      - name: Check Helm release status
        run: |
          make helm-status

      # Installed by the chart, the operator must do its job, not only start: the fake live
      # origin of the e2e suite, a StreamProbe for it, and Ready=True with reason Live.
      - name: A StreamProbe reaches Live
        run: |
          kubectl apply -f test/e2e/testdata/fake-hls.yaml
          kubectl rollout status deploy/fake-hls --timeout=3m
          kubectl apply -f - <<'EOF'
          apiVersion: streaming.allan-nava.github.io/v1alpha1
          kind: StreamProbe
          metadata:
            name: fake-live
          spec:
            url: http://fake-hls.default.svc.cluster.local:8080/live.m3u8
            interval: 5s
          EOF
          kubectl wait streamprobe/fake-live --for=jsonpath='{.status.conditions[?(@.type=="Ready")].reason}'=Live --timeout=2m
          kubectl get streamprobe fake-live

      # With the Prometheus Operator's CRDs, the chart's ServiceMonitor and PrometheusRule
      # (SP-10) must be accepted by the API server, not only rendered.
      - name: ServiceMonitor and alerts
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm install prometheus-crds prometheus-community/prometheus-operator-crds --wait
          make helm-deploy HELM_EXTRA_ARGS="--set prometheus.enabled=true"
          kubectl get servicemonitor,prometheusrule -n streamprobe-operator-system
          kubectl get prometheusrule -n streamprobe-operator-system -o jsonpath='{.items[0].spec.groups[0].rules[*].alert}' | tee /dev/stderr | grep -q StreamNotLive
