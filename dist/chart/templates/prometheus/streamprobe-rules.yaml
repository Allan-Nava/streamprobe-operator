{{- if and .Values.prometheus.enabled .Values.prometheus.rules.enabled }}
# The alerts, from files/streamprobe.rules.yaml (tested by promtool in test/prometheus/).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "streamprobe-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.prometheus.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  name: {{ include "streamprobe-operator.resourceName" (dict "suffix" "rules" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
{{ .Files.Get "files/streamprobe.rules.yaml" | indent 2 }}
{{- end }}
