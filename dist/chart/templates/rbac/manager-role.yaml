apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "streamprobe-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - streaming.allan-nava.github.io
  resources:
  - streamprobes/status
  verbs:
  - get
  - patch
  - update
